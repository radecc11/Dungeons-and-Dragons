<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nexus VTT - Sessão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.1/socket.io.js"></script>
    <style>
        .token { filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.6)); }
    </style>
</head>
<body class="bg-[#0a0a0a] text-gray-200 h-screen flex overflow-hidden">
    
    <!-- Menu Lateral -->
    <nav class="w-64 bg-[#121212] border-r border-[#222] flex flex-col z-50 p-4 overflow-y-auto">
        <h1 class="text-xl font-bold text-white mb-4 tracking-wider">NEXUS<span class="text-indigo-500">VTT</span></h1>
        
        <!-- Info do Usuário Logado -->
        <div class="mb-6 border-b border-[#333] pb-4">
            <p class="text-sm text-gray-400">Usuário: <span class="text-white font-bold">{{ username }}</span></p>
            <p class="text-xs text-indigo-400 mb-2">Nível: {{ role }}</p>
            <a href="/logout" class="text-xs text-red-400 hover:text-red-300 underline">Desconectar</a>
        </div>

        <!-- PAINEL EXCLUSIVO DO MASTER ADMIN -->
        {% if role == 'master_admin' %}
        <div class="mb-6 bg-indigo-900/20 p-3 rounded border border-indigo-900/50">
            <h3 class="font-bold mb-3 text-sm text-indigo-400">👑 Criar Contas (Master)</h3>
            <input type="text" id="newUsername" placeholder="Novo Login" class="w-full bg-[#121212] p-2 rounded mb-2 border border-[#333] text-white text-xs">
            <input type="text" id="newPassword" placeholder="Senha" class="w-full bg-[#121212] p-2 rounded mb-2 border border-[#333] text-white text-xs">
            <select id="newRole" class="w-full bg-[#121212] p-2 rounded mb-2 border border-[#333] text-white text-xs">
                <option value="admin">Mestre da Sessão</option>
                <option value="player">Jogador Comum</option>
            </select>
            <button onclick="createUser()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-1.5 rounded text-xs">Adicionar Usuário</button>
        </div>
        {% endif %}
        
        <div class="mb-6 bg-[#1a1a1a] p-4 rounded border border-[#333]">
            <h3 class="font-bold mb-2 text-sm text-gray-400">Criar Personagem</h3>
            <input type="text" id="charName" placeholder="Nome" class="w-full bg-[#121212] p-2 rounded mb-2 border border-[#333] text-white">
            <input type="text" id="charImg" placeholder="URL da Imagem PNG" class="w-full bg-[#121212] p-2 rounded mb-2 border border-[#333] text-white">
            <button onclick="createCharacter()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded">Adicionar</button>
        </div>

        <div id="characterList" class="flex flex-col gap-2"></div>
    </nav>

    <!-- Tabuleiro -->
    <main id="board" class="flex-1 relative bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1605806616949-1e87b487cb2a?q=80&w=1920')">
        <div id="tokensContainer" class="absolute inset-0"></div>
    </main>

    <script>
        const socket = io();
        let localState = { characters: {}, boardTokens: {} };
        const userRole = "{{ role }}"; // Variável que vem do Python

        // --- SISTEMA DE ADMIN ---
        function createUser() {
            const user = document.getElementById('newUsername').value;
            const pass = document.getElementById('newPassword').value;
            const role = document.getElementById('newRole').value;
            if(user && pass) {
                socket.emit('create_user', {username: user, password: pass, role: role});
            }
        }

        socket.on('user_created', (res) => {
            alert(res.msg);
            if(res.success) {
                document.getElementById('newUsername').value = '';
                document.getElementById('newPassword').value = '';
            }
        });

        // --- SISTEMA DO JOGO ---
        socket.on('sync_state', (serverState) => {
            localState = serverState;
            document.getElementById('board').style.backgroundImage = `url(${serverState.session.backgroundUrl})`;
            renderCharacters();
            renderTokens();
        });

        socket.on('token_moved', (data) => {
            localState.boardTokens[data.charId] = { x: data.x, y: data.y };
            const tokenEl = document.getElementById(`token-${data.charId}`);
            if (tokenEl) {
                tokenEl.style.left = `${data.x}px`;
                tokenEl.style.top = `${data.y}px`;
            }
        });

        function createCharacter() {
            const name = document.getElementById('charName').value;
            const img = document.getElementById('charImg').value || 'https://via.placeholder.com/80/333333/FFFFFF?text=?';
            if (!name) return;
            
            const charId = 'char_' + Date.now();
            socket.emit('add_character', { id: charId, name: name, avatarUrl: img });
            
            document.getElementById('charName').value = '';
            document.getElementById('charImg').value = '';
        }

        function toggleBoard(charId) {
            // Apenas mestres ou master admin podem por na mesa (opcional)
            socket.emit('toggle_board', { charId: charId });
        }

        function renderCharacters() {
            const container = document.getElementById('characterList');
            container.innerHTML = '';
            Object.values(localState.characters).forEach(char => {
                const isOnBoard = !!localState.boardTokens[char.id];
                container.innerHTML += `
                    <div class="bg-[#1a1a1a] p-3 rounded border border-[#333] flex justify-between items-center">
                        <span class="font-bold text-sm truncate w-24">${char.name}</span>
                        <button onclick="toggleBoard('${char.id}')" class="text-xs px-2 py-1 rounded ${isOnBoard ? 'bg-red-900/50 text-red-400' : 'bg-indigo-900/50 text-indigo-400'}">
                            ${isOnBoard ? 'Remover' : 'Na Mesa'}
                        </button>
                    </div>
                `;
            });
        }

        function renderTokens() {
            const container = document.getElementById('tokensContainer');
            container.innerHTML = '';
            
            Object.entries(localState.boardTokens).forEach(([id, pos]) => {
                const char = localState.characters[id];
                if (!char) return;

                const token = document.createElement('div');
                token.id = `token-${id}`;
                token.className = "absolute cursor-grab flex flex-col items-center select-none";
                token.style.left = `${pos.x}px`;
                token.style.top = `${pos.y}px`;
                token.style.width = '80px';
                
                token.innerHTML = `
                    <div class="token transition-transform hover:scale-105">
                        <img src="${char.avatarUrl}" draggable="false" class="w-[80px] h-[80px] object-contain pointer-events-none">
                    </div>
                    <div class="mt-1 px-2 py-0.5 bg-black/70 text-white text-[10px] rounded backdrop-blur-sm truncate max-w-full">${char.name}</div>
                `;

                token.addEventListener('pointerdown', (e) => {
                    const rect = token.getBoundingClientRect();
                    const boardRect = document.getElementById('board').getBoundingClientRect();
                    const offsetX = e.clientX - rect.left;
                    const offsetY = e.clientY - rect.top;

                    function onPointerMove(moveEvent) {
                        let x = moveEvent.clientX - boardRect.left - offsetX;
                        let y = moveEvent.clientY - boardRect.top - offsetY;
                        
                        token.style.left = `${x}px`;
                        token.style.top = `${y}px`;
                        
                        socket.emit('move_token', { charId: id, x: x, y: y });
                    }

                    function onPointerUp() {
                        window.removeEventListener('pointermove', onPointerMove);
                        window.removeEventListener('pointerup', onPointerUp);
                    }

                    window.addEventListener('pointermove', onPointerMove);
                    window.addEventListener('pointerup', onPointerUp);
                });

                container.appendChild(token);
            });
        }
    </script>
</body>
</html>
